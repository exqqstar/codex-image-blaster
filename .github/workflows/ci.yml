name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: no-key continuity / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: No-key continuity tests
        run: node --test tests/*.test.mjs
      - name: Install viewer dependencies
        run: npm ci --prefix app
      - name: Typecheck
        run: npm run typecheck --prefix app
      - name: Test
        run: npm run test --prefix app
      - name: Build
        run: npm run build --prefix app
